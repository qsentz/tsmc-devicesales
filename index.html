function chartFallback(canvasEl, msg){
  if (!canvasEl) return;
  const div = document.createElement('div');
  div.className = 'empty';
  div.style.paddingTop = '40px';
  div.textContent = msg;
  canvasEl.replaceWith(div);
}

function updateCharts(M){
  if (typeof Chart === 'undefined'){
    chartFallback(document.getElementById('chartVolume'), 'โหลดไลบรารีกราฟ (Chart.js) ไม่สำเร็จ');
    return;
  }

  const labels = M.buckets.map(b => hourLabel(b.date, M.mode));
  const aisData = M.buckets.map(b => b.AIS);
  const partnerData = M.buckets.map(b => b.PARTNER);
  // Cumulative running total (AIS+PARTNER) across buckets, plotted as a line on a second
  // right-hand axis so it's easy to see progress toward the day's eventual total at a
  // glance, on top of the per-bucket bars.
  let running = 0;
  const cumulativeData = M.buckets.map(b => (running += (b.AIS + b.PARTNER)));
  const ctx1 = document.getElementById('chartVolume');
  if (ctx1){
    if (!charts.volume){
      charts.volume = new Chart(ctx1, {
        type: 'bar',
        data: { labels, datasets: [
          {type:'bar', label:'AIS', data: aisData, backgroundColor:'#22B8CF', stack:'s', borderRadius:3, maxBarThickness:42, yAxisID:'y'},
          {type:'bar', label:'PARTNER', data: partnerData, backgroundColor:'#6C7A93', stack:'s', borderRadius:3, maxBarThickness:42, yAxisID:'y'},
          {type:'line', label:'สะสม (Cumulative)', data: cumulativeData, borderColor:'#F5B841', backgroundColor:'#F5B841', borderWidth:2, pointRadius:2, pointBackgroundColor:'#F5B841', tension:.3, fill:false, yAxisID:'y1', order:0}
        ]},
        options: {
          responsive:true, maintainAspectRatio:false, animation:{duration:450, easing:'easeOutQuart'},
          // mode:'index', intersect:false: the tooltip (and hover) target the whole x
          // position (hour bucket) rather than requiring the pointer to land exactly on a
          // bar or line-point. This is what makes every dataset at that hour — AIS, PARTNER,
          // and the Cumulative line — show together in one tooltip, and it's also what fixes
          // the Cumulative line blocking the bars: since hit-testing no longer depends on
          // which element is drawn on top at that pixel, the line stays visually in front
          // (so its trend is still easy to read) without shadowing the bars underneath it.
          interaction:{mode:'index', intersect:false},
          onHover: (evt, elements, chart) => { chart.canvas.style.cursor = elements.length ? 'help' : 'default'; },
          scales:{
            x:{stacked:true, grid:{display:false}, ticks:{color:'#7C8AA8', font:{size:9.5}}},
            y:{stacked:true, beginAtZero:true, grid:{color:'#1F2D48'}, ticks:{color:'#7C8AA8', font:{size:9.5}}},
            y1:{position:'right', beginAtZero:true, grid:{drawOnChartArea:false}, ticks:{color:'#F5B841', font:{size:9.5}}}
          },
          plugins:{
            legend:{position:'top', labels:{boxWidth:10, font:{size:10.5}, color:'#BAC6DC'}},
            tooltip:{
              ...TOOLTIP_STYLE,
              mode:'index', intersect:false,
              callbacks:{ label: c => `${c.dataset.label}: ${fmtNum(c.parsed.y)}` }
            }
          }
        }
      });
    } else {
      charts.volume.data.labels = labels;
      charts.volume.data.datasets[0].data = aisData;
      charts.volume.data.datasets[1].data = partnerData;
      charts.volume.data.datasets[2].data = cumulativeData;
      charts.volume.update();
    }
  }

  updateCompareChart(M);
}

/* Year-over-Year comparison chart: this year's per-day order count (from the main sheet,
   M.dayCounts) plotted against last year's per-day totals from the Compare_data sheet
   (global `compareData`). Aligned by "days since each year's own first day with data" —
   e.g. if this year's data starts 11/09/2026 and last year's Compare_data starts 19/09/2025,
   those two dates are both "day 1" and get compared directly, day 2 vs day 2, and so on —
   rather than matching the same calendar day/month across years (the two periods don't
   necessarily start on the same date). The whole card (and its column in #heroRow) stays
   hidden whenever Compare_data hasn't been (successfully) loaded, so this never shows an
   empty chart or leaves a blank gap next to the hero. */
function updateCompareChart(M){
  const card = document.getElementById('compareCard');
  const heroRow = document.getElementById('heroRow');
  if (!card) return;

  const thisYearDayKeys = Object.keys(M.dayCounts).sort();
  if (typeof Chart === 'undefined' || !compareData.length || !thisYearDayKeys.length){
    card.style.display = 'none';
    if (heroRow) heroRow.classList.add('no-compare');
    return;
  }
  card.style.display = '';
  if (heroRow) heroRow.classList.remove('no-compare');

  const [ty, tm, td] = thisYearDayKeys[0].split('-').map(Number);
  const thisYearStart = new Date(ty, tm - 1, td);

  const pad = n => String(n).padStart(2,'0');
  const fmtDate = d => pad(d.getDate()) + '/' + pad(d.getMonth()+1);
  const labels = [];
  const thisYearData = [];
  const lastYearData = [];
  const thisYearDates = [];
  const lastYearDates = [];
  compareData.forEach((c, i) => {
    const tyDate = new Date(thisYearStart.getFullYear(), thisYearStart.getMonth(), thisYearStart.getDate() + i);
    thisYearData.push(M.dayCounts[dayKey(tyDate)] || 0);
    lastYearData.push(c.count);
    thisYearDates.push(fmtDate(tyDate));
    lastYearDates.push(fmtDate(c.date));
    labels.push(`Day ${i + 1}`);
  });

  const thisYearTotal = thisYearData.reduce((a,b) => a+b, 0);
  const lastYearTotal = lastYearData.reduce((a,b) => a+b, 0);
  const tagEl = document.getElementById('tag-comparetotal');
  if (tagEl) tagEl.textContent = `${fmtNum(thisYearTotal)} vs ${fmtNum(lastYearTotal)}`;

  const ctx = document.getElementById('chartCompare');
  if (!ctx) return;
  if (!charts.compare){
    charts.compare = new Chart(ctx, {
      type: 'bar',
      // Cyan (this year) vs. amber (last year) — far apart on the color wheel, unlike the
      // previous cyan-vs-gray pairing, so the two series stay easy to tell apart at a glance.
      data: { labels, datasets: [
        {label:'ปีนี้', data: thisYearData, backgroundColor:'#22B8CF', borderRadius:3, maxBarThickness:28},
        {label:'ปีที่แล้ว', data: lastYearData, backgroundColor:'#F5B841', borderRadius:3, maxBarThickness:28}
      ]},
      options: {
        responsive:true, maintainAspectRatio:false, animation:{duration:450, easing:'easeOutQuart'},
        // mode:'index', intersect:false: hovering anywhere over a "Day N" column shows both
        // this-year and last-year bars for that day in one tooltip, instead of only whichever
        // single bar the pointer happens to be directly over.
        interaction:{mode:'index', intersect:false},
        onHover: (evt, elements, chart) => { chart.canvas.style.cursor = elements.length ? 'help' : 'default'; },
        scales:{
          x:{grid:{display:false}, ticks:{color:'#7C8AA8', font:{size:9}}},
          y:{beginAtZero:true, grid:{color:'#1F2D48'}, ticks:{color:'#7C8AA8', font:{size:9}}}
        },
        plugins:{
          legend:{position:'top', labels:{boxWidth:8, font:{size:9.5}, color:'#BAC6DC'}},
          tooltip:{
            ...TOOLTIP_STYLE,
            mode:'index', intersect:false,
            callbacks:{
              title: items => {
                const i = items[0].dataIndex;
                return `${labels[i]} (ปีนี้ ${thisYearDates[i]} / ปีที่แล้ว ${lastYearDates[i]})`;
              },
              label: c => `${c.dataset.label}: ${fmtNum(c.parsed.y)}`,
              // Difference + % difference between the two series for this day, shown below
              // the two per-series lines above so the comparison reads at a glance without
              // the person having to do the subtraction themselves.
              afterBody: items => {
                const i = items[0].dataIndex;
                const ty = thisYearData[i], ly = lastYearData[i];
                const diff = ty - ly;
                const sign = diff > 0 ? '+' : (diff < 0 ? '' : '±');
                const pct = ly ? (diff / ly * 100) : (ty ? 100 : 0);
                return ['', `ผลต่าง: ${sign}${fmtNum(diff)} (${sign}${pct.toFixed(1)}%)`];
              }
            }
          }
        }
      }
    });
  } else {
    charts.compare.data.labels = labels;
    charts.compare.data.datasets[0].data = thisYearData;
    charts.compare.data.datasets[1].data = lastYearData;
    charts.compare.update();
  }
}

function updateStockChart(M){
  if (typeof Chart === 'undefined'){
    chartFallback(document.getElementById('chartStock'), 'โหลดไลบรารีกราฟไม่สำเร็จ');
    return;
  }
  const ctx = document.getElementById('chartStock');
  if (!ctx) return;
  const labels = M.stockArr.map(s => s.name);
  const data = M.stockArr.map(s => s.count);
  const colors = labels.map((_,i) => STOCK_PALETTE[i % STOCK_PALETTE.length]);
  if (!charts.stock){
    charts.stock = new Chart(ctx, {
      type: 'doughnut',
      data: { labels, datasets: [{ data, backgroundColor: colors, borderColor: '#141F35', borderWidth: 2 }] },
      options: {
        responsive:true, maintainAspectRatio:false, cutout:'66%',
        animation:{duration:450, easing:'easeOutQuart'},
        onHover: (evt, elements, chart) => { chart.canvas.style.cursor = elements.length ? 'help' : 'default'; },
        plugins:{
          legend:{display:false},
          tooltip:{
            ...TOOLTIP_STYLE,
            callbacks:{ label: c => {
              const item = lastMetrics && lastMetrics.stockArr && lastMetrics.stockArr[c.dataIndex];
              const pct = item ? item.pct : 0;
              return `${c.label}: ${fmtNum(c.parsed)} (${fmtPct(pct)})`;
            } }
          }
        }
      }
    });
  } else {
    charts.stock.data.labels = labels;
    charts.stock.data.datasets[0].data = data;
    charts.stock.data.datasets[0].backgroundColor = colors;
    charts.stock.update();
  }
}

/* Standardizes the height of the four "Order Source & Stock Destination" / "Order Volume" /
   "Order Omni & Shipping" cards (see the .grid-asym CSS comment for the full picture). Order
   Volume is the reference and is never touched — its height is fixed by CSS alone — everything
   else is measured and pinned to match it. Skipped below the 900px breakpoint, where .grid-asym
   collapses to a single stacked column and forcing these heights would just leave blank space. */
function syncSummaryCardHeights(){
  const volumeCard = document.getElementById('cardVolume');
  const omniCard = document.getElementById('cardOmni');
  const sourceCard = document.getElementById('cardOrderSource');
  if (!volumeCard || !omniCard || !sourceCard) return;
  // Clear any previous override first so shrinking content (e.g. fewer shipping types) is
  // measured correctly too, instead of being padded out by a stale, now-too-tall min-height.
  omniCard.style.minHeight = '';
  sourceCard.style.minHeight = '';
  if (window.innerWidth < 900) return;
  // Double rAF: wait for the browser to finish the layout pass triggered by clearing the
  // min-heights above (and by Chart.js's own canvas resize) before measuring, so the values
  // read below reflect the settled layout rather than a mid-reflow snapshot.
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      const refHeight = volumeCard.offsetHeight;
      if (!refHeight) return;
      omniCard.style.minHeight = refHeight + 'px';
      requestAnimationFrame(() => {
        const gap = 12; // matches .col-wide{gap:12px}
        sourceCard.style.minHeight = (refHeight + gap + omniCard.offsetHeight) + 'px';
      });
    });
  });
}

/* ===================== IMAGE HOVER PREVIEW ===================== */
function showImgPreview(url){
  const box = document.getElementById('imgPreview');
  const img = document.getElementById('imgPreviewImg');
  if (!box || !img || !url) return;
  img.src = url;
  box.style.display = 'block';
}
function positionImgPreview(evt){
  const box = document.getElementById('imgPreview');
  if (!box || box.style.display !== 'block') return;
  const pad = 14, boxW = 144, boxH = 144;
  let x = evt.clientX + pad, y = evt.clientY + pad;
  if (x + boxW > window.innerWidth) x = evt.clientX - boxW - pad;
  if (y + boxH > window.innerHeight) y = evt.clientY - boxH - pad;
  box.style.left = Math.max(4, x) + 'px';
  box.style.top = Math.max(4, y) + 'px';
}
function hideImgPreview(){
  const box = document.getElementById('imgPreview');
  if (box) box.style.display = 'none';
}
function bindImgPreviewEvents(){
  document.addEventListener('mouseover', e => {
    const row = e.target.closest && e.target.closest('.rank-row[data-img]');
    if (row) showImgPreview(row.dataset.img);
  });
  document.addEventListener('mousemove', positionImgPreview);
  document.addEventListener('mouseout', e => {
    const row = e.target.closest && e.target.closest('.rank-row[data-img]');
    if (row && (!e.relatedTarget || !row.contains(e.relatedTarget))) hideImgPreview();
  });
}

/* ===================== ERROR / STATUS UI ===================== */
function setStatus(mode, text){
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (mode === 'error' ? ' err' : mode === 'loading' ? ' loading' : ' ok');
  document.getElementById('statusText').textContent = text;
}
function showBanner(msg){
  const b = document.getElementById('banner');
  b.innerHTML = msg;
  b.classList.add('show');
}
function hideBanner(){ document.getElementById('banner').classList.remove('show'); }

/* ===================== AUTO REFRESH ===================== */
function resetRefreshBar(){
  const bar = document.getElementById('refreshBar');
  if (!bar) return;
  bar.style.transition = 'none';
  bar.style.width = '0%';
  void bar.offsetWidth;
  bar.style.transition = `width ${AUTO_REFRESH_MS}ms linear`;
  bar.style.width = '100%';
}
function startAutoRefresh(){
  if (refreshTimer) clearInterval(refreshTimer);
  resetRefreshBar();
  refreshTimer = setInterval(() => { resetRefreshBar(); loadData(true); }, AUTO_REFRESH_MS);
}

/* ===================== MAIN LOAD FLOW ===================== */
async function loadData(isAuto){
  const cfg = getConfig();
  if (!cfg.sheetId){
    document.getElementById('configPanel').classList.add('open');
    setStatus('error', 'ยังไม่ได้ตั้งค่า Sheet ID');
    return;
  }
  if (isLoading) return;
  isLoading = true;
  if (!isAuto) setStatus('loading', 'กำลังโหลดข้อมูล...');
  try {
    await loadLocationMasterIfNeeded(cfg.sheetId, !isAuto);
    // Always force a fresh fetch (not just "once per sheetId" — see loadCompareDataIfNeeded's
    // own comment) so a newly appended row in Compare_data shows up on the next auto-refresh
    // poll too, the same way the main Order sheet already does, instead of needing a manual
    // browser refresh or a "LOAD DATA" click to pick it up.
    await loadCompareDataIfNeeded(cfg.sheetId, true);
    const {cols, rows} = await fetchSheet(cfg.sheetId, cfg.sheetName);
    const parsed = buildRows(cols, rows);
    updateDashboard(parsed);
    hideBanner();
    setStatus('ok', 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH'));
  } catch(err){
    console.error(err);
    setStatus('error', 'โหลดข้อมูลไม่สำเร็จ');
    if (!isAuto || !dashboardBuilt) showBanner('<strong>โหลดข้อมูลไม่สำเร็จ:</strong> ' + err.message);
  } finally {
    isLoading = false;
  }
}

/* ===================== INIT / EVENTS ===================== */
(function init(){
  const cfg = getConfig();
  document.getElementById('inputSheetId').value = cfg.sheetId;
  document.getElementById('inputSheetName').value = cfg.sheetName;
  document.getElementById('inputSecretKey').value = cfg.secretKey;
  bindImgPreviewEvents();

  const applySecretKey = () => {
    const secretKey = document.getElementById('inputSecretKey').value.trim();
    const saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    saveConfig({ ...saved, secretKey });
    clearDecryptCache();
    closeTrackTooltip();
    renderTrackingOrders();
  };
  document.getElementById('btnApplyKey').addEventListener('click', applySecretKey);
  document.getElementById('inputSecretKey').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') applySecretKey();
  });

  document.getElementById('dashTitle').addEventListener('dblclick', () => {
    document.getElementById('configPanel').classList.toggle('open');
  });
  document.getElementById('btnConfig').addEventListener('click', () => {
    document.getElementById('configPanel').classList.toggle('open');
  });
  document.getElementById('btnRefresh').addEventListener('click', () => { resetRefreshBar(); loadData(false); });

  const bindRankSliders = () => {
    const sliderDevice = document.getElementById('sliderDevice');
    const sliderCampaign = document.getElementById('sliderCampaign');
    const sliderTrack = document.getElementById('sliderTrack');
    const trackFilter = document.getElementById('trackFilter');
    if (sliderDevice && !sliderDevice.dataset.bound) {
      sliderDevice.addEventListener('input', renderDeviceAccessory);
      sliderDevice.dataset.bound = '1';
    }
    if (sliderCampaign && !sliderCampaign.dataset.bound) {
      sliderCampaign.addEventListener('input', renderCampaignService);
      sliderCampaign.dataset.bound = '1';
    }
    if (sliderTrack && !sliderTrack.dataset.bound) {
      sliderTrack.addEventListener('input', renderTrackingOrders);
      sliderTrack.dataset.bound = '1';
    }
    if (trackFilter && !trackFilter.dataset.bound) {
      trackFilter.addEventListener('input', renderTrackingOrders);
      trackFilter.dataset.bound = '1';
    }
  };

  // "i" buttons in the Tracking Order table are recreated on every render, so this is
  // delegated on document instead of bound per-button. Clicking one opens/closes a pinned
  // tooltip (see openTrackTooltip) rather than expanding an inline row.
  document.addEventListener('click', (e) => {
    const closeBtn = e.target.closest && e.target.closest('.tt-close');
    if (closeBtn){ closeTrackTooltip(); return; }
    const btn = e.target.closest && e.target.closest('[data-track-toggle]');
    if (btn){ openTrackTooltip(btn.getAttribute('data-track-toggle'), btn); return; }
    if (openTrackKey && !(e.target.closest && e.target.closest('#trackTooltip'))) closeTrackTooltip();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeTrackTooltip(); });
  window.addEventListener('scroll', () => { if (openTrackKey) closeTrackTooltip(); }, true);
  window.addEventListener('resize', () => { if (openTrackKey) closeTrackTooltip(); });

  // Re-sync the four summary card heights on resize (crossing the 900px breakpoint, or a
  // width change that alters how much a card's own content wraps/grows), debounced so a drag-
  // resize doesn't re-measure on every single pixel.
  let cardHeightResizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(cardHeightResizeTimer);
    cardHeightResizeTimer = setTimeout(syncSummaryCardHeights, 120);
  });

  initHoverTips();

  document.getElementById('btnLoad').addEventListener('click', () => {
    const sheetId = document.getElementById('inputSheetId').value.trim();
    const sheetName = document.getElementById('inputSheetName').value.trim() || 'Order';
    const secretKey = document.getElementById('inputSecretKey').value.trim();
    if (!sheetId) { showBanner('กรุณากรอก Google Sheet ID'); return; }
    saveConfig({sheetId, sheetName, secretKey});
    document.getElementById('configPanel').classList.remove('open');
    loadData(false);
    startAutoRefresh();
  });

  if (cfg.sheetId) { loadData(false); startAutoRefresh(); }
  else document.getElementById('configPanel').classList.add('open');

  const sliderBinderTimer = setInterval(() => {
    const sliderDevice = document.getElementById('sliderDevice');
    const sliderCampaign = document.getElementById('sliderCampaign');
    const sliderTrack = document.getElementById('sliderTrack');
    const trackFilter = document.getElementById('trackFilter');
    if (sliderDevice || sliderCampaign || sliderTrack || trackFilter) {
      bindRankSliders();
      if (sliderDevice?.dataset.bound && sliderCampaign?.dataset.bound && sliderTrack?.dataset.bound && trackFilter?.dataset.bound) {
        clearInterval(sliderBinderTimer);
      }
    }
  }, 50);
})();
</script>
