<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>[TS-MC] Pre-Order Booking Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600..900&family=IBM+Plex+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Light theme — Pre-Order Booking */
    --bg:#F2F5FA;
    --bg-2:#FFFFFF;
    --card:#FFFFFF;
    --border:#E2E8F0;
    --border-soft:#EDF1F7;

    --text:#1E293B;
    --text-dim:#475569;
    --muted:#94A3B8;

    /* Semantic */
    --green:#059669;   --green-bg:#D1FAE5;   --green-soft:rgba(5,150,105,.12);
    --gold:#D97706;    --gold-bg:#FEF3C7;    --gold-soft:rgba(217,119,6,.12);
    --sky:#0284C7;     --sky-bg:#E0F2FE;     --sky-soft:rgba(2,132,199,.10);
    --red:#DC2626;     --red-bg:#FEE2E2;     --red-soft:rgba(220,38,38,.10);
    --slate:#64748B;   --slate-bg:#F1F5F9;
    --violet:#7C3AED;  --violet-bg:#EDE9FE;   --violet-soft:rgba(124,58,237,.10);
    --pink:#DB2777;    --pink-bg:#FCE7F3;

    --radius:12px;
    --shadow:0 1px 3px rgba(15,23,42,.07);
    --shadow-pop:0 8px 24px rgba(15,23,42,.14);
    --font-serif:'Fraunces','Noto Serif',serif;
    --font-sans:'IBM Plex Sans Thai','IBM Plex Sans',-apple-system,sans-serif;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;padding:0;}
  body{
    background:var(--bg);color:var(--text);
    font-family:var(--font-sans);font-size:12px;
    display:flex;flex-direction:column;overflow-x:hidden;
  }
  ::-webkit-scrollbar{width:6px;height:6px;}
  ::-webkit-scrollbar-thumb{background:#CBD5E1;border-radius:6px;}
  ::-webkit-scrollbar-track{background:transparent;}

  .topbar-wrap{position:sticky;top:0;z-index:20;flex:0 0 auto;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:10px 20px;background:var(--bg-2);border-bottom:1px solid var(--border);
  }
  .topbar-title{display:flex;align-items:center;gap:10px;}
  .topbar h1{
    font-family:var(--font-serif);font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em;
    cursor:default;user-select:none;color:var(--text);
  }
  .live-chip{
    font-size:9px;font-weight:700;color:#fff;background:var(--violet);
    padding:2px 7px 1px;border-radius:99px;display:inline-block;letter-spacing:.05em;
  }
  .topbar .sub{font-size:10.5px;color:var(--muted);margin-top:2px;}
  .topbar-right{display:flex;align-items:center;gap:10px;}
  .btn{
    font-family:var(--font-sans);border:1.5px solid var(--border);background:var(--card);color:var(--text-dim);
    padding:5px 14px;border-radius:999px;font-size:11px;cursor:pointer;font-weight:700;
    transition:all .12s ease;
  }
  .btn:hover{background:var(--slate-bg);color:var(--text);}
  .btn.primary{background:var(--violet);color:#fff;border-color:var(--violet);}
  .btn.primary:hover{background:#6D28D9;}
  .btn.hidden-cfg{display:none;}

  .live-wrap{display:flex;align-items:center;gap:6px;font-size:10.5px;color:var(--text-dim);}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--green);display:inline-block;position:relative;}
  .status-dot.err{background:var(--red);}
  .status-dot.loading{background:var(--gold);}
  .status-dot.ok::after{
    content:'';position:absolute;inset:-4px;border-radius:50%;
    border:1.5px solid var(--green);animation:pulseRing 1.8s ease-out infinite;
  }
  @keyframes pulseRing{0%{transform:scale(.6);opacity:.7;}80%{transform:scale(1.9);opacity:0;}100%{opacity:0;}}
  #lastUpdated{display:flex;align-items:center;gap:6px;}

  .refresh-track{height:2px;background:var(--border-soft);overflow:hidden;}
  .refresh-bar{height:100%;width:0%;background:var(--violet);}

  .config{
    display:none;padding:12px 20px;background:var(--bg-2);border-bottom:1px solid var(--border);
    gap:12px;flex-wrap:wrap;align-items:flex-end;
  }
  .config.open{display:flex;}
  .field{display:flex;flex-direction:column;gap:4px;}
  .field label{font-size:10px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;}
  .field input{
    font-family:var(--font-sans);
    border:1.5px solid var(--border);border-radius:8px;padding:6px 10px;font-size:12px;min-width:240px;
    background:var(--bg);color:var(--text);
  }
  .field input:focus{outline:none;border-color:var(--violet);}

  .wrap{
    flex:1 1 auto;max-width:1500px;width:100%;margin:0 auto;padding:14px 16px 24px;
    display:flex;flex-direction:column;gap:12px;min-height:0;
  }
  #banner{display:none;padding:8px 12px;border-radius:8px;background:var(--red-bg);border:1px solid #FCA5A5;color:#991B1B;font-size:11.5px;line-height:1.4;}
  #banner.show{display:block;}
  #dashboard{display:flex;flex-direction:column;gap:12px;}

  @keyframes fadeInUp{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

  /* ---------- KPI cards ---------- */
  .kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;}
  .kpi{
    position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);
    padding:13px 16px 12px;box-shadow:var(--shadow);overflow:hidden;animation:fadeInUp .35s ease both;
  }
  .kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--kpi-c,var(--violet));}
  .kpi .k-ico{
    position:absolute;right:12px;top:12px;width:30px;height:30px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;background:var(--kpi-bg);font-size:15px;
  }
  .kpi .k-label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
  .kpi .k-val{font-family:var(--font-serif);font-size:29px;font-weight:800;color:var(--text);line-height:1.15;margin-top:3px;}
  .kpi .k-val.money{font-size:23px;}
  .kpi .k-sub{font-size:10px;color:var(--text-dim);margin-top:4px;line-height:1.5;}
  .kpi .k-sub b{font-weight:800;color:var(--text);}
  .kpi .k-ring{position:absolute;right:12px;bottom:10px;width:46px;height:46px;}
  .kpi .k-ring canvas{width:46px;height:46px;display:block;}

  /* ---------- Generic card ---------- */
  .card{
    position:relative;min-width:0;background:var(--card);border:1px solid var(--border);
    border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);
    display:flex;flex-direction:column;
  }
  .card h2{
    font-family:var(--font-serif);font-size:13.5px;margin:0 0 10px;font-weight:700;color:var(--text);
    display:flex;align-items:baseline;justify-content:space-between;gap:8px;flex-wrap:wrap;
  }
  .card h2 .tag{
    font-family:var(--font-sans);font-size:9.5px;color:var(--muted);font-weight:600;
    background:var(--slate-bg);padding:2px 8px;border-radius:99px;
  }
  .card-body{min-height:0;}
  .soft{transition:opacity .28s ease;}

  /* ---------- Grid rows ---------- */
  .grid-2-1{display:grid;grid-template-columns:1fr;gap:12px;align-items:stretch;}
  @media(min-width:960px){.grid-2-1{grid-template-columns:2fr 1fr;}}
  .grid-duo{display:grid;grid-template-columns:1fr;gap:12px;align-items:stretch;}
  @media(min-width:960px){.grid-duo{grid-template-columns:1fr 1fr;}}

  .chart-wrap{position:relative;height:190px;}
  .chart-wrap.mid{height:235px;}
  .chart-wrap.tall{height:265px;}
  .chart-wrap.donut-lg{position:relative;width:128px;height:128px;flex:0 0 auto;}
  .donut-wrap{display:flex;align-items:center;gap:14px;flex:1 1 auto;min-height:0;}
  .split2{display:grid;grid-template-columns:1fr;gap:10px;align-items:start;}
  @media(min-width:640px){.split2{grid-template-columns:1.25fr 1fr;}}

  /* ---------- Legend / list rows ---------- */
  .legend-col{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:7px;}
  .legend-row{display:flex;align-items:center;justify-content:space-between;gap:6px;font-size:10.5px;}
  .legend-row .lg-name{display:flex;align-items:center;gap:6px;min-width:0;overflow:hidden;}
  .legend-row .lg-dot{width:8px;height:8px;border-radius:3px;flex:0 0 auto;}
  .legend-row .lg-label{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .legend-row .lg-val{flex:0 0 auto;font-weight:800;color:var(--text);}
  .legend-row .lg-pct{flex:0 0 auto;font-size:9px;color:var(--muted);margin-left:4px;min-width:34px;text-align:right;}

  /* ---------- Rank list (service care / shipping) ---------- */
  .rank-list{display:flex;flex-direction:column;gap:2px;}
  .rank-row{position:relative;display:flex;align-items:center;justify-content:space-between;gap:6px;padding:4px 8px;border-radius:6px;overflow:hidden;}
  .rank-row:nth-child(odd){background:var(--slate-bg);}
  .rank-bar{position:absolute;left:0;top:0;bottom:0;opacity:.16;border-radius:6px;transition:width .5s ease;}
  .rank-name{position:relative;z-index:1;font-size:10.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-name.has-img{cursor:help;border-bottom:1px dashed var(--muted);}
  .rank-count{position:relative;z-index:1;font-size:10.5px;font-weight:800;flex:0 0 auto;}

  /* ---------- Duration tiers ---------- */
  .tier-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;}
  .tier-box{border-radius:10px;padding:9px 4px;text-align:center;border:1px solid var(--border-soft);}
  .tier-box .n{font-family:var(--font-serif);font-size:17px;font-weight:800;}
  .tier-box .l{font-size:9.5px;margin-top:2px;font-weight:700;}
  .tier-box .p{font-size:9px;opacity:.85;}

  table{width:100%;border-collapse:collapse;font-size:10.5px;}
  th{text-align:left;color:var(--muted);font-weight:700;padding:4px 6px;border-bottom:1px solid var(--border);font-size:9px;position:sticky;top:0;background:var(--card);z-index:1;}
  td{padding:5px 6px;border-bottom:1px solid var(--border-soft);color:var(--text-dim);}
  tr:last-child td{border-bottom:none;}
  tbody tr:hover{background:var(--slate-bg);}
  .mono{font-family:ui-monospace,Menlo,monospace;color:var(--text);}
  .red-txt{color:var(--red);font-weight:700;}

  .empty{color:var(--muted);font-size:11px;text-align:center;padding:12px 0;}
  .table-scroll{overflow:auto;}
  .mini-table{margin-top:10px;}

  /* ---------- Tracking Order (kept from original) ---------- */
  .track-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px;flex-wrap:wrap;}
  .track-filter-input{
    font-family:var(--font-sans);border:1.5px solid var(--border);border-radius:8px;padding:6px 12px;
    font-size:11px;background:var(--bg);color:var(--text);min-width:240px;flex:1 1 240px;
  }
  .track-filter-input:focus{outline:none;border-color:var(--violet);}
  .track-filter-input::placeholder{color:var(--muted);}
  .track-slider-row{display:flex;align-items:center;gap:6px;flex:0 0 auto;}
  .track-slider-row .rank-slider-lbl{font-size:9.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;}
  .track-slider-row input[type=range]{width:120px;accent-color:var(--violet);}
  .track-slider-row .rank-slider-val{font-size:10.5px;font-weight:800;min-width:30px;text-align:right;}
  .track-table-scroll{max-height:460px;}
  .track-table{font-size:10px;}
  .track-table td,.track-table th{white-space:nowrap;}
  .track-table th.col-info,.track-table td.col-info{width:22px;padding-left:6px;padding-right:2px;}
  .track-table th.col-no,.track-table td.col-no{width:30px;color:var(--muted);}
  .info-btn{
    width:16px;height:16px;border-radius:50%;border:1.5px solid var(--gold);background:transparent;color:var(--gold);
    font-size:9px;font-weight:800;font-style:italic;font-family:Georgia,serif;cursor:pointer;
    display:inline-flex;align-items:center;justify-content:center;padding:0;line-height:1;
  }
  .info-btn:hover{background:var(--gold-bg);}
  .info-btn.open{background:var(--gold);color:#fff;}
  .badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:9px;font-weight:700;white-space:nowrap;}
  .cust-name-cell{cursor:help;border-bottom:1px dashed var(--muted);}
  @media(max-width:640px){.track-toolbar{flex-direction:column;align-items:stretch;}.track-filter-input{min-width:0;}}

  /* Pinned info tooltip */
  .track-tooltip{
    position:fixed;z-index:1000;display:none;width:280px;max-width:calc(100vw - 20px);
    background:var(--card);border:1.5px solid var(--gold);border-radius:10px;
    box-shadow:var(--shadow-pop);padding:10px 12px 12px;font-size:11px;color:var(--text);
  }
  .track-tooltip.show{display:block;animation:fadeInUp .16s ease both;}
  .track-tooltip .tt-close{
    position:absolute;top:4px;right:5px;width:18px;height:18px;border-radius:50%;
    border:none;background:transparent;color:var(--muted);font-size:14px;line-height:1;cursor:pointer;
  }
  .track-tooltip .tt-close:hover{color:var(--text);background:var(--slate-bg);}
  .track-tooltip .tt-img{
    display:block;width:100%;max-height:120px;object-fit:contain;border-radius:6px;
    margin-bottom:8px;background:#fff;border:1px solid var(--border-soft);
  }
  .track-tooltip .tt-title{font-family:var(--font-serif);font-weight:700;font-size:12px;color:var(--text);margin:0 0 6px;padding-right:16px;word-break:break-word;}
  .track-tooltip .tt-pii{
    display:flex;flex-direction:column;gap:2px;padding:6px 8px;margin-bottom:8px;
    background:var(--gold-bg);border-radius:6px;border:1px dashed var(--gold);
  }
  .track-tooltip .tt-pii .dl{font-size:9px;color:#92400E;font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  .track-tooltip .tt-pii .dv{font-size:11.5px;color:var(--text);font-weight:600;word-break:break-word;}
  .track-tooltip .tt-lock{font-size:10px;color:var(--muted);line-height:1.5;margin-bottom:8px;}
  .track-tooltip .track-detail-grid{display:grid;grid-template-columns:1fr;gap:5px;}
  .track-tooltip .track-detail-grid .dl{font-size:9px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.02em;}
  .track-tooltip .track-detail-grid .dv{font-size:11px;color:var(--text-dim);margin-top:1px;word-break:break-word;}

  /* Column clipping */
  .track-table th.col-commname,.track-table td.col-commname{max-width:140px;}
  .track-table th.col-orderomni,.track-table td.col-orderomni{max-width:115px;}
  .cust-name-cell{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;}

  /* Generic hover tooltip */
  [data-tip]{cursor:help;}
  .hover-tip{
    position:fixed;z-index:1200;display:none;max-width:240px;
    background:var(--card);border:1px solid var(--violet);border-radius:8px;
    box-shadow:var(--shadow-pop);padding:6px 9px;font-size:10.5px;
    color:var(--text-dim);line-height:1.6;pointer-events:none;word-break:break-word;
    white-space:pre-line;
  }
  .hover-tip.show{display:block;animation:fadeInUp .12s ease both;}

  @media(max-width:600px){.wrap{padding:10px 10px 20px;}.topbar{padding:10px 12px;}}
</style>
</head>
<body>

<div class="topbar-wrap">
  <div class="topbar">
    <div class="topbar-title-wrap">
      <div class="topbar-title">
        <h1 id="dashTitle" title="ดับเบิลคลิกเพื่อตั้งค่า Google Sheet">[TS-MC] Pre-Order Booking Dashboard</h1>
        <span class="live-chip">LIVE</span>
      </div>
      <div class="sub" id="rangeLabel">DISCONNECT</div>
    </div>
    <div class="topbar-right">
      <div class="live-wrap">
        <span id="lastUpdated"><span class="status-dot" id="statusDot"></span><span id="statusText">Data not yet loaded.</span></span>
      </div>
      <button class="btn hidden-cfg" id="btnConfig">SETTING</button>
      <button class="btn primary" id="btnRefresh">REFRESH</button>
    </div>
  </div>
  <div class="refresh-track"><div class="refresh-bar" id="refreshBar"></div></div>
  <div class="config" id="configPanel">
    <div class="field">
      <label>DATA ID</label>
      <input id="inputSheetId" placeholder="1AbCDeFGhijklmnop_xxxxxxxxxxxx" />
    </div>
    <div class="field">
      <label>COLLECTION</label>
      <input id="inputSheetName" placeholder="Order" value="Order" />
    </div>
    <button class="btn primary" id="btnLoad">LOAD DATA</button>
    <div class="field">
      <label>SECRET KEY</label>
      <input id="inputSecretKey" type="password" placeholder="FILL SECRET KEY (Optional)" autocomplete="off" />
    </div>
    <button class="btn" id="btnApplyKey">SUBMIT</button>
  </div>
</div>

<div class="wrap">
  <div id="banner"></div>
  <div id="dashboard" style="display:none;"></div>
  <div id="placeholder" class="empty" style="padding:80px 0;font-size:13.5px;">
    FILL THE DATA ID FOR Load Data.
  </div>
</div>

<div class="track-tooltip" id="trackTooltip"></div>
<div class="hover-tip" id="hoverTip"></div>

<script>
/* ===================== CONFIG / STATE ===================== */
const LS_KEY = 'orderDashboardConfig';
const AUTO_REFRESH_MS = 10000;
let charts = {};
let dashboardBuilt = false;
let refreshTimer = null;
let isLoading = false;
let lastMetrics = null;

/* Chart palette — semantic, distinct hues so each slice is readable at a glance */
const C = {
  pre:'#D97706', preFill:'rgba(217,119,6,.20)',
  nonpre:'#059669', nonpreFill:'rgba(5,150,105,.16)',
  ais:'#7C3AED', partner:'#0EA5E9',
  slow:'#DC2626', slowFill:'rgba(220,38,38,.14)',
  sky:'#0284C7', pink:'#DB2777', slate:'#94A3B8', violet:'#7C3AED',
  status:{
    COMPLETE:'#059669',
    WAITING_PAYMENT:'#F59E0B',
    READY_TO_PAY:'#0284C7',
    PENDING:'#94A3B8',
    DELETE:'#DC2626'
  },
  statusBg:{
    COMPLETE:'#D1FAE5',
    WAITING_PAYMENT:'#FEF3C7',
    READY_TO_PAY:'#E0F2FE',
    PENDING:'#F1F5F9',
    DELETE:'#FEE2E2'
  }
};
const PALETTE = ['#7C3AED','#0284C7','#059669','#D97706','#DB2777','#DC2626','#94A3B8'];

const TOOLTIP_STYLE = {
  backgroundColor:'#FFFFFF',
  titleColor:'#1E293B',
  bodyColor:'#475569',
  borderColor:'#E2E8F0',
  borderWidth:1,
  cornerRadius:8,
  padding:10,
  boxWidth:8,
  boxHeight:8,
  boxPadding:4,
  usePointStyle:true,
  displayColors:true,
  titleFont:{ family:"'IBM Plex Sans Thai','IBM Plex Sans',sans-serif", size:11.5, weight:'700' },
  bodyFont:{ family:"'IBM Plex Sans Thai','IBM Plex Sans',sans-serif", size:11 }
};

function getConfig(){
  const params = new URLSearchParams(location.search);
  const saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
  return {
    sheetId: params.get('sheetId') || saved.sheetId || '',
    sheetName: params.get('sheetName') || saved.sheetName || 'Order',
    // Deliberately not read from the URL (unlike sheetId/sheetName) so it can't end up
    // in browser history / shared links / server logs — only ever from localStorage.
    secretKey: saved.secretKey || ''
  };
}
function saveConfig(cfg){ localStorage.setItem(LS_KEY, JSON.stringify(cfg)); }

/* ===================== COLUMN MAP ===================== */
const COL = {
  ts: 'TIMESTAMP',
  transactionId: 'transactionId',
  orderId: 'orders.orderId',
  orderType: 'orders.orderType',
  state: 'orders.status',
  commercialName: 'orders.device.commercialName',
  campaignName: 'orders.device.campaignName',
  preBookingNo: 'orders.device.preBookingNo',
  serviceCareTitle: 'orders.serviceCare.title',
  subStockDestination: 'orders.subStockDestination',
  menu: 'orders.menu'
};

const COL_OPTIONAL = {
  locationSource: 'locationSource',
  imageUrl: 'orders.device.imageUrl',
  userId: 'userId',
  custFirstName: 'customer.firstName',
  custLastName: 'customer.lastName',
  custMobileNo: 'customer.cusMobileNo',
  orderState: 'orders.state',
  brand: 'orders.device.brand',
  model: 'orders.device.model',
  matCode: 'orders.device.matCode',
  priceIncAmt: 'orders.device.priceIncAmt',
  priceDiscountAmt: 'orders.device.priceDiscountAmt',
  resOrderNo: 'orders.reserve.orderNo',
  resLocationName: 'orders.reserve.locationName',
  resType: 'orders.reserve.type',
  resShippingType: 'orders.reserve.shippingType',
  resShippingSLA: 'orders.reserve.shippingSLA'
};
const STATES = ['COMPLETE','WAITING_PAYMENT','READY_TO_PAY','PENDING','DELETE'];

/* ===================== DECRYPTION (mirrors Code.gs encryptText_ / decryptText_) =====================
   customer.firstName / customer.lastName / customer.cusMobileNo are stored in the Sheet as
   base64( 8-byte random IV ++ XOR(plaintext, keystream) ), where the keystream is built from
   repeated HMAC-SHA256(secretKey, ivHex + '|' + counter) blocks. Decrypting here needs the same
   Secret Key that Code.gs's setupEncryptionKey() saved to Script Properties — entered once in
   the config panel above and kept only in this browser's localStorage; it is never sent anywhere. */
let hmacKeyCache = null;
const decryptCache = new Map();

function base64ToBytes(b64){
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
function bytesToHex(bytes){
  let s = '';
  for (let i = 0; i < bytes.length; i++) s += bytes[i].toString(16).padStart(2, '0');
  return s;
}
function getHmacKey_(secretKey){
  if (hmacKeyCache && hmacKeyCache.secretKey === secretKey) return hmacKeyCache.cryptoKeyPromise;
  const p = crypto.subtle.importKey('raw', new TextEncoder().encode(secretKey), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']);
  hmacKeyCache = { secretKey, cryptoKeyPromise: p };
  return p;
}
async function hmacSha256Bytes_(secretKey, message){
  const key = await getHmacKey_(secretKey);
  const sig = await crypto.subtle.sign('HMAC', key, new TextEncoder().encode(message));
  return new Uint8Array(sig);
}
async function generateKeystream_(secretKey, ivHex, length){
  const keystream = new Uint8Array(length);
  let filled = 0, counter = 0;
  while (filled < length){
    const block = await hmacSha256Bytes_(secretKey, ivHex + '|' + counter);
    for (let i = 0; i < block.length && filled < length; i++, filled++) keystream[filled] = block[i];
    counter++;
  }
  return keystream;
}
async function decryptText_(cipherB64, secretKey){
  if (!cipherB64) return '';
  const combined = base64ToBytes(cipherB64);
  if (combined.length <= 8) return '';
  const ivBytes = combined.slice(0, 8);
  const cipherBytes = combined.slice(8);
  const ivHex = bytesToHex(ivBytes);
  const keystream = await generateKeystream_(secretKey, ivHex, cipherBytes.length);
  const plainBytes = new Uint8Array(cipherBytes.length);
  for (let i = 0; i < cipherBytes.length; i++) plainBytes[i] = cipherBytes[i] ^ keystream[i];
  return new TextDecoder('utf-8').decode(plainBytes);
}
function decryptCached(cipherB64, secretKey){
  if (!cipherB64 || !secretKey) return Promise.resolve('');
  const cacheKey = secretKey + '::' + cipherB64;
  if (!decryptCache.has(cacheKey)){
    decryptCache.set(cacheKey, decryptText_(cipherB64, secretKey).catch(() => '__DECRYPT_FAILED__'));
  }
  return decryptCache.get(cacheKey);
}
function clearDecryptCache(){ decryptCache.clear(); hmacKeyCache = null; }
function getSecretKey(){
  const el = document.getElementById('inputSecretKey');
  return el ? el.value.trim() : '';
}

/* ===================== FETCH (Google Visualization / gviz) ===================== */
async function fetchSheet(sheetId, sheetName){
  const url = `https://docs.google.com/spreadsheets/d/${encodeURIComponent(sheetId)}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}&headers=1&_=${Date.now()}`;
  const res = await fetch(url);
  const text = await res.text();
  const m = text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\);?\s*$/);
  if (!m) {
    throw new Error('อ่านข้อมูลจาก COLLECTION ไม่สำเร็จ (ตรวจสอบว่า DATA ID / ชื่อ COLLECTION)');
  }
  const json = JSON.parse(m[1]);
  if (json.status === 'error') {
    const detail = (json.errors && json.errors[0] && json.errors[0].detailed_message) || 'unknown error';
    throw new Error('COLLECTION ส่ง ERROR กลับมา: ' + detail);
  }
  const cols = json.table.cols.map(c => (c.label || c.id || '').trim());
  const rows = json.table.rows.map(r => (r.c || []).map(cell => cell ? cell.v : null));
  return { cols, rows };
}

/* ===================== LOCATION MASTER ===================== */
const LOCATION_MASTER_SHEET_NAME = 'LocationMaster';
let locationNameMap = {};
let locationMasterLoadedFor = null;
async function loadLocationMasterIfNeeded(sheetId, force){
  if (!force && locationMasterLoadedFor === sheetId) return;
  try {
    const {cols, rows} = await fetchSheet(sheetId, LOCATION_MASTER_SHEET_NAME);
    const codeIdx = cols.indexOf('locationCode');
    const nameIdx = cols.indexOf('locationName');
    if (codeIdx === -1 || nameIdx === -1){
      throw new Error(`ไม่พบคอลัมน์ locationCode/locationName ใน "${LOCATION_MASTER_SHEET_NAME}"`);
    }
    const map = {};
    rows.forEach(r => {
      const code = r[codeIdx] == null ? '' : String(r[codeIdx]).trim();
      const name = r[nameIdx] == null ? '' : String(r[nameIdx]).trim();
      if (code && name) map[code] = name;
    });
    locationNameMap = map;
  } catch(err){
    console.warn('โหลด LocationMaster ไม่สำเร็จ (จะแสดง locationSource แบบรหัสดิบแทน):', err.message);
    if (locationMasterLoadedFor !== sheetId) locationNameMap = {};
  } finally {
    locationMasterLoadedFor = sheetId;
  }
}
function locationDisplayName(code){
  if (isBlank(code)) return code;
  const name = locationNameMap[code];
  return name ? `${code} - ${name}` : code;
}

function parseGvizDate(v){
  if (v == null) return null;
  if (typeof v === 'string' && v.indexOf('Date(') === 0){
    const p = v.substring(5, v.length - 1).split(',').map(Number);
    return new Date(p[0], p[1], p[2] || 1, p[3] || 0, p[4] || 0, p[5] || 0);
  }
  if (v instanceof Date) return v;
  const d = new Date(v);
  return isNaN(d.getTime()) ? null : d;
}

function buildRows(cols, rawRows){
  const idx = {};
  for (const k in COL) idx[k] = cols.indexOf(COL[k]);
  const missing = Object.keys(COL).filter(k => idx[k] === -1);
  if (missing.length){
    throw new Error('ไม่พบคอลัมน์ต่อไปนี้ใน COLLECTION: ' + missing.map(k => COL[k]).join(', ') +
      ' — ตรวจสอบว่าหัวคอลัมน์ตรงกับที่ BACKEND เขียนไว้');
  }
  for (const k in COL_OPTIONAL) idx[k] = cols.indexOf(COL_OPTIONAL[k]);
  const str = v => (v === null || v === undefined) ? '' : String(v).trim();
  const num = v => {
    if (v === null || v === undefined || v === '') return 0;
    const n = parseFloat(String(v).replace(/,/g,''));
    return isNaN(n) ? 0 : n;
  };
  const get = (r, key) => idx[key] === -1 ? undefined : r[idx[key]];
  return rawRows.map(r => ({
    ts: parseGvizDate(r[idx.ts]),
    transactionId: str(r[idx.transactionId]),
    orderId: str(r[idx.orderId]),
    orderType: str(r[idx.orderType]),
    state: str(r[idx.state]),
    commercialName: str(r[idx.commercialName]),
    campaignName: str(r[idx.campaignName]),
    preBookingNo: str(r[idx.preBookingNo]),
    serviceCareTitle: str(r[idx.serviceCareTitle]),
    subStockDestination: str(r[idx.subStockDestination]),
    menu: str(r[idx.menu]),
    locationSource: str(get(r,'locationSource')),
    imageUrl: str(get(r,'imageUrl')),
    userId: str(get(r,'userId')),
    custFirstName: str(get(r,'custFirstName')),
    custLastName: str(get(r,'custLastName')),
    custMobileNo: str(get(r,'custMobileNo')),
    orderState: str(get(r,'orderState')),
    brand: str(get(r,'brand')),
    model: str(get(r,'model')),
    matCode: str(get(r,'matCode')),
    priceIncAmt: num(get(r,'priceIncAmt')),
    priceDiscountAmt: num(get(r,'priceDiscountAmt')),
    resOrderNo: str(get(r,'resOrderNo')),
    resLocationName: str(get(r,'resLocationName')),
    resType: str(get(r,'resType')),
    resShippingType: str(get(r,'resShippingType')),
    resShippingSLA: str(get(r,'resShippingSLA'))
  })).filter(r => r.orderId);
}

/* ===================== HELPERS ===================== */
const isBlank = v => !v || v === '-';
const grp = ot => /AIS/i.test(ot) ? 'AIS' : 'PARTNER';
function decodeObjectIdMs(oid){
  if (!oid || oid.length < 8) return null;
  const hex8 = oid.substring(0, 8);
  if (!/^[0-9a-fA-F]{8}$/.test(hex8)) return null;
  return parseInt(hex8, 16) * 1000;
}
function topN(rows, field, n){
  const m = {};
  rows.forEach(r => { const k = r[field]; m[k] = (m[k] || 0) + 1; });
  return Object.entries(m).map(([name,count]) => ({name,count})).sort((a,b)=>b.count-a.count).slice(0, n);
}
function fmtPct(p){ return (Math.round(p*10)/10).toFixed(1) + '%'; }
function fmtMoney(n){ return '฿' + Math.round(n).toLocaleString('en-US'); }

// Largest-remainder rounding so a group of percentages always sums to exactly
// round(sum(counts)/total*1000)/10 (100.0% when counts cover total).
function distributePct(counts, total){
  if (!total) return counts.map(() => 0);
  const raw = counts.map(c => (c / total) * 1000);
  const floors = raw.map(Math.floor);
  const used = floors.reduce((a,b) => a+b, 0);
  const target = Math.round(raw.reduce((a,b) => a+b, 0));
  const remainder = Math.max(0, Math.min(counts.length, target - used));
  const order = raw.map((v,i) => ({i, frac: v - floors[i]})).sort((a,b) => b.frac - a.frac);
  for (let k = 0; k < remainder; k++) floors[order[k].i]++;
  return floors.map(v => v / 10);
}
function fmtNum(n){ return n.toLocaleString('en-US'); }
function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function bucketDate(d, mode){
  if (mode === 'hour') return new Date(d.getFullYear(), d.getMonth(), d.getDate(), d.getHours());
  if (mode === 'month') return new Date(d.getFullYear(), d.getMonth(), 1);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}
function hourLabel(d, mode){
  const pad = n => String(n).padStart(2,'0');
  if (mode === 'hour') return pad(d.getHours()) + ':00';
  if (mode === 'month') return d.toLocaleDateString('en-GB',{month:'short',year:'numeric'});
  return pad(d.getDate()) + '/' + pad(d.getMonth()+1);
}
function shortName(s, n){
  s = String(s || '');
  return s.length > n ? s.substring(0, n - 1) + '…' : s;
}

function softUpdate(el, html){
  if (!el) return;
  if (el.innerHTML !== html) {
    requestAnimationFrame(() => { el.innerHTML = html; });
  }
}

function animateNumber(el, to){
  if (!el) return;
  const from = parseInt((el.textContent || '0').replace(/,/g,''), 10) || 0;
  if (!dashboardBuilt || from === to){ el.textContent = fmtNum(to); return; }
  const dur = 500, start = performance.now();
  function step(t){
    const p = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = fmtNum(Math.round(from + (to - from) * eased));
    if (p < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function drawRing(canvasEl, pct, color, size){
  size = size || 64;
  if (!canvasEl || !canvasEl.getContext) return;
  const ctx = canvasEl.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvasEl.width = size * dpr; canvasEl.height = size * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const cx = size/2, cy = size/2, r = size/2 - 5;
  const target = Math.max(0, Math.min(100, pct));
  const from = canvasEl.dataset.pct ? parseFloat(canvasEl.dataset.pct) : 0;
  canvasEl.dataset.pct = target;
  const dur = 650, start = performance.now();
  const fontSize = size <= 46 ? 8.5 : 10;
  function frame(t){
    const p = Math.min(1, (t - start) / dur);
    const eased = 1 - Math.pow(1 - p, 3);
    const cur = from + (target - from) * eased;
    ctx.clearRect(0, 0, size, size);
    ctx.lineWidth = size <= 46 ? 4.5 : 6; ctx.lineCap = 'round';
    ctx.strokeStyle = '#E2E8F0';
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
    ctx.strokeStyle = color;
    ctx.beginPath();
    ctx.arc(cx, cy, r, -Math.PI/2, -Math.PI/2 + (cur/100)*Math.PI*2);
    ctx.stroke();
    ctx.fillStyle = '#1E293B';
    ctx.font = '800 ' + fontSize + 'px "IBM Plex Sans Thai",-apple-system,sans-serif';
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(cur.toFixed(1) + '%', cx, cy);
    if (p < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

/* ===================== METRICS ===================== */
function computeMetrics(rows){
  const stateRows = rows.filter(r => r.state);
  const grandTotal = stateRows.length;
  const stateCounts = {}; STATES.forEach(s => stateCounts[s] = 0);
  stateRows.forEach(r => { if (stateCounts[r.state] === undefined) stateCounts[r.state] = 0; stateCounts[r.state]++; });
  const completeCount = stateCounts.COMPLETE || 0;
  const otherStates = STATES.filter(s => s !== 'COMPLETE');
  const statusPctAll = distributePct([completeCount, ...otherStates.map(s => stateCounts[s]||0)], grandTotal);
  const completePct = statusPctAll[0];
  const statusArr = [
    { state:'COMPLETE', count:completeCount, pct:completePct },
    ...otherStates.map((s, idx) => ({ state:s, count: stateCounts[s] || 0, pct: statusPctAll[idx+1] }))
  ];
  // "รอดำเนินการ" = the three not-yet-finished statuses, as one KPI
  const pendingCount = (stateCounts.WAITING_PAYMENT||0) + (stateCounts.READY_TO_PAY||0) + (stateCounts.PENDING||0);
  const [pendingPct] = distributePct([pendingCount, grandTotal - pendingCount], grandTotal);

  const completeRows = rows.filter(r => r.state === 'COMPLETE');
  const prebookRows = completeRows.filter(r => !isBlank(r.preBookingNo));

  // ---- Booking value (revenue) ----
  const revenueTotal = completeRows.reduce((s,r) => s + (r.priceIncAmt || 0), 0);
  const discountTotal = completeRows.reduce((s,r) => s + (r.priceDiscountAmt || 0), 0);
  const prebookRevenue = prebookRows.reduce((s,r) => s + (r.priceIncAmt || 0), 0);
  const revenueByGrp = {
    AIS: completeRows.filter(r => grp(r.orderType) === 'AIS').reduce((s,r) => s + (r.priceIncAmt || 0), 0),
    PARTNER: completeRows.filter(r => grp(r.orderType) === 'PARTNER').reduce((s,r) => s + (r.priceIncAmt || 0), 0)
  };

  const otRows = completeRows.filter(r => r.orderType);
  const otCounts = {AIS:0, PARTNER:0};
  otRows.forEach(r => otCounts[grp(r.orderType)]++);
  const otTotal = otCounts.AIS + otCounts.PARTNER;
  const prebookByGrp = {AIS:0, PARTNER:0};
  prebookRows.forEach(r => { if (r.orderType) prebookByGrp[grp(r.orderType)]++; });
  const prebookTotal = prebookRows.length;
  const nonPrebookByGrp = {
    AIS: otCounts.AIS - prebookByGrp.AIS,
    PARTNER: otCounts.PARTNER - prebookByGrp.PARTNER
  };
  const [otPctAIS, otPctPartner] = distributePct([otCounts.AIS, otCounts.PARTNER], otTotal);
  const otPct = {AIS: otPctAIS, PARTNER: otPctPartner};
  const [prePctAIS, nonPrePctAIS] = distributePct([prebookByGrp.AIS, nonPrebookByGrp.AIS], otTotal);
  const [prePctPartner, nonPrePctPartner] = distributePct([prebookByGrp.PARTNER, nonPrebookByGrp.PARTNER], otTotal);
  const prebookPctByGrp = {AIS: prePctAIS, PARTNER: prePctPartner};
  const nonPrebookPctByGrp = {AIS: nonPrePctAIS, PARTNER: nonPrePctPartner};

  const nonPrebookTotal = completeCount - prebookTotal;
  const [prebookPctOfComplete, nonPrebookPctOfComplete] = distributePct([prebookTotal, nonPrebookTotal], completeCount);

  // Sub stock destination
  const stockRows = completeRows.filter(r => !isBlank(r.subStockDestination));
  const stockMap = {};
  stockRows.forEach(r => stockMap[r.subStockDestination] = (stockMap[r.subStockDestination]||0)+1);
  let stockArr = Object.entries(stockMap).map(([name,count])=>({name,count})).sort((a,b)=>b.count-a.count);
  if (stockArr.length > 4){
    const top4 = stockArr.slice(0,4);
    const other = stockArr.slice(4).reduce((s,x)=>s+x.count,0);
    stockArr = [...top4, {name:'OTHER', count: other}];
  }
  const stockTotal = stockRows.length;
  const stockPctArr = distributePct(stockArr.map(s => s.count), stockTotal);
  stockArr = stockArr.map((s,i) => ({...s, pct: stockPctArr[i]}));

  // Order Omni & Shipping
  const omniRows = completeRows.filter(r => !isBlank(r.resOrderNo));
  const omniTotal = omniRows.length;
  const nonOmniTotal = completeCount - omniTotal;
  const [omniPctOfComplete, nonOmniPctOfComplete] = distributePct([omniTotal, nonOmniTotal], completeCount);
  const shipMap = {};
  omniRows.forEach(r => {
    const label = [r.resShippingType, r.resShippingSLA].filter(x => !isBlank(x)).join(' - ') || 'ไม่ระบุ';
    shipMap[label] = (shipMap[label] || 0) + 1;
  });
  let shipArr = Object.entries(shipMap).map(([name,count]) => ({name,count})).sort((a,b) => b.count - a.count);
  const shipTotal = omniTotal;
  const shipPctArr = distributePct(shipArr.map(s => s.count), shipTotal);
  shipArr = shipArr.map((s,i) => ({...s, pct: shipPctArr[i]}));

  // Order by menu
  const menuCounts = {};
  completeRows.forEach(r => { const m = r.menu || 'Unknown'; menuCounts[m] = (menuCounts[m]||0)+1; });
  const menuPrebook = {};
  prebookRows.forEach(r => { const m = r.menu || 'Unknown'; menuPrebook[m] = (menuPrebook[m]||0)+1; });
  const menuArr = Object.entries(menuCounts).map(([menu,orderCount]) => {
    const prebookCount = menuPrebook[menu] || 0;
    const nonPrebookCount = orderCount - prebookCount;
    const [prebookPct, nonPrebookPct] = distributePct([prebookCount, nonPrebookCount], orderCount);
    return { menu, orderCount, prebookCount, nonPrebookCount, prebookPct, nonPrebookPct };
  }).sort((a,b) => b.orderCount - a.orderCount);

  // ---- Booking trend: completed orders over time, split Pre-Booking vs ปกติ ----
  const tsRows = completeRows.filter(r => r.ts);
  let mode = 'hour', buckets = [];
  if (tsRows.length){
    const times = tsRows.map(r => r.ts.getTime());
    const rangeHours = (Math.max(...times) - Math.min(...times)) / 3600000;
    mode = rangeHours <= 24 ? 'hour' : (rangeHours > 24*30 ? 'month' : 'day');
    const volMap = {};
    tsRows.forEach(r => {
      const b = bucketDate(r.ts, mode);
      const key = b.getTime();
      volMap[key] = volMap[key] || {date: b, pre: 0, nonpre: 0};
      if (isBlank(r.preBookingNo)) volMap[key].nonpre++;
      else volMap[key].pre++;
    });
    buckets = Object.values(volMap).sort((a,b) => a.date - b.date);
  }
  const volTotal = tsRows.length;

  // Duration overview
  const durRows = [];
  completeRows.forEach(r => {
    if (!r.ts) return;
    const createdMs = decodeObjectIdMs(r.orderId);
    if (createdMs == null) return;
    const durationMs = r.ts.getTime() - createdMs;
    if (durationMs < 0) return;
    const durationMin = durationMs / 60000;
    const tier = durationMs < 600000 ? 'green' : (durationMs < 1800000 ? 'yellow' : 'red');
    durRows.push({...r, durationMs, durationMin, tier});
  });
  const durTotal = durRows.length;
  const tierCounts = {green:0, yellow:0, red:0};
  durRows.forEach(r => tierCounts[r.tier]++);
  const [greenPct, yellowPct, redPct] = distributePct([tierCounts.green, tierCounts.yellow, tierCounts.red], durTotal);
  const tierPct = {green: greenPct, yellow: yellowPct, red: redPct};
  const avgDurMin = durTotal ? durRows.reduce((s,r) => s + r.durationMin, 0) / durTotal : 0;

  let durBuckets = [];
  if (durRows.length){
    const dMap = {};
    durRows.forEach(r => {
      const b = bucketDate(r.ts, mode);
      const key = b.getTime();
      dMap[key] = dMap[key] || {date: b, sum: 0, n: 0};
      dMap[key].sum += r.durationMin; dMap[key].n++;
    });
    durBuckets = Object.values(dMap).sort((a,b) => a.date - b.date)
      .map(x => ({date: x.date, avg: x.sum / x.n}));
  }

  const slowest = durRows.filter(r => r.tier === 'red')
    .sort((a,b) => b.durationMs - a.durationMs).slice(0, 6)
    .map(r => ({
      id: r.transactionId || r.orderId,
      orderType: r.orderType || '-',
      durLabel: r.durationMin >= 60
        ? Math.floor(r.durationMin/60) + 'h ' + Math.floor(r.durationMin%60) + 'm'
        : Math.floor(r.durationMin) + 'm'
    }));

  // Top selling device / accessory
  const validName = n => n && n !== '-' && n !== 'Invalid' && n.length < 100;
  const devRows = completeRows.filter(r => r.menu !== 'AccessoriesGadgetIOTOnly' && validName(r.commercialName));
  const deviceTop = topN(devRows, 'commercialName', 10);
  const deviceOrders = devRows.length;

  // Top campaigns / service care
  const campRows = completeRows.filter(r => !isBlank(r.campaignName));
  const svcRows = completeRows.filter(r => !isBlank(r.serviceCareTitle));
  const campTop = topN(campRows, 'campaignName', 8);
  const svcTop = topN(svcRows, 'serviceCareTitle', 6);
  const campOrders = campRows.length;
  const svcOrders = svcRows.length;

  // Branch / location source
  const locRows = completeRows.filter(r => !isBlank(r.locationSource));
  const locMap = {};
  locRows.forEach(r => {
    locMap[r.locationSource] = (locMap[r.locationSource] || 0) + 1;
  });
  const locTop = Object.entries(locMap).map(([code,count]) => ({
    code, name: locationDisplayName(code), count
  })).sort((a,b) => b.count - a.count).slice(0, 10);
  const locTotal = locRows.length;
  const locItems = Object.keys(locMap).length;

  // ---- Tracking Order (row-level table, every status — kept from original) ----
  const trackGrandTotal = rows.filter(r => r.orderId).length;
  const trackAll = rows.filter(r => r.orderId)
    .slice()
    .sort((a,b) => (b.ts ? b.ts.getTime() : 0) - (a.ts ? a.ts.getTime() : 0))
    .map(r => {
      const createdMs = decodeObjectIdMs(r.orderId);
      const durationMs = (r.ts && createdMs != null) ? (r.ts.getTime() - createdMs) : null;
      return { ...r, createdMs, durationMs: (durationMs != null && durationMs >= 0) ? durationMs : null };
    });
  const trackTotal = trackAll.length;

  return {
    grandTotal, completeCount, completePct, statusArr, stateCounts, pendingCount, pendingPct,
    revenueTotal, discountTotal, prebookRevenue, revenueByGrp,
    otCounts, otTotal, otPct, prebookByGrp, prebookTotal, nonPrebookByGrp,
    prebookPctByGrp, nonPrebookPctByGrp, nonPrebookTotal, prebookPctOfComplete, nonPrebookPctOfComplete,
    stockArr, stockTotal,
    omniTotal, nonOmniTotal, omniPctOfComplete, nonOmniPctOfComplete, shipArr, shipTotal,
    menuArr,
    mode, buckets, volTotal,
    durTotal, tierCounts, tierPct, avgDurMin, slowest, durBuckets,
    deviceTop, deviceOrders,
    campTop, svcTop, campOrders, svcOrders,
    locTop, locTotal, locItems,
    trackAll, trackTotal, trackGrandTotal
  };
}

function customerNameMasked(first, last){
  const f = (first || '').trim();
  let l = (last || '').trim();
  if (l.length > 1) l = l[0] + 'x'.repeat(l.length - 1);
  const combined = (f + ' ' + l).trim();
  return combined || '-';
}

const ORDER_STATE_BLUE = new Set(['ORDER_REQUESTED','KYC_VERIFIED','SIM_IDENTIFIED','APPLEWATCH_VERIFIED','MOBILENO_VERIFIED','NEWCA_VERIFIED','EFORM_SIGNED','IDCARD_IDENTIFIED','VERIFY_PASSPORT','REPI_VERIFY_MOBILE','MOBILE_IDENTIFIED','PROFILE_VERIFIED']);

function orderStateBadgeHtml(state){
  if (isBlank(state)) return '<span class="badge" style="background:#F1F5F9;color:#64748B">-</span>';

}

function durationLabel(ms){
  const totalMin = Math.floor(ms / 60000);
  const d = Math.floor(totalMin / 1440), h = Math.floor((totalMin % 1440) / 60), m = totalMin % 60;
  const parts = [];
  if (d > 0) parts.push(d + 'd');
  if (h > 0) parts.push(h + 'h');
  parts.push(m + 'm');
  if (d === 0 && h === 0 && m === 0){
    const s = Math.floor((ms % 60000) / 1000);
    parts.push(s + 's');
  }
  return parts.join(' ');
}
function durationBadgeHtml(durationMs, createdMs){
  if (durationMs == null){
    return '<span class="badge" style="background:#F1F5F9;color:#64748B">-</span>';
  }
  const bg = durationMs < 600000 ? '#D1FAE5' : durationMs < 1800000 ? '#FEF3C7' : '#FEE2E2';
  const fg = durationMs < 600000 ? '#047857' : durationMs < 1800000 ? '#B45309' : '#B91C1C';
  const startLabel = createdMs != null ? new Date(createdMs).toLocaleString('th-TH') : '-';
  const totalSec = Math.floor(durationMs / 1000);
  const fullLabel = `${Math.floor(totalSec/3600)}h ${Math.floor((totalSec%3600)/60)}m ${totalSec%60}s`;
  const tip = ['เริ่มสร้าง: ' + startLabel, 'ระยะเวลา: ' + fullLabel].join('\n');
  return `<span class="badge" style="background:${bg};color:${fg}" data-tip="${esc(tip)}">${esc(durationLabel(durationMs))}</span>`;
}

async function buildTrackTooltipHtml(r){
  const secretKey = getSecretKey();

  if (!secretKey){
    piiHtml = `<div class="tt-lock">🔒 กรอก Secret Key ในแผงตั้งค่า (ดับเบิลคลิกหัวข้อด้านบน) เพื่อดูชื่อ-เบอร์โทรเต็ม</div>`;
  } else {
    const [first, last, mobile] = await Promise.all([
      decryptCached(r.custFirstName, secretKey),
      decryptCached(r.custLastName, secretKey),
      decryptCached(r.custMobileNo, secretKey)
    ]);
    if ([first, last, mobile].includes('__DECRYPT_FAILED__')){
      piiHtml = `<div class="tt-lock">⚠️ ถอดรหัสไม่สำเร็จ — ตรวจสอบว่า Secret Key ตรงกับที่ตั้งไว้ใน Code.gs</div>`;
    } else {
      const fullName = (first + ' ' + last).trim() || '-';
      piiHtml = `<div class="tt-pii">
        <div class="dl">Customer Name</div><div class="dv">${esc(fullName)}</div>
        <div class="dl" style="margin-top:4px;">Mobile No.</div><div class="dv">${esc(mobile || '-')}</div>
      </div>`;
    }
  }

  const imgHtml = !isBlank(r.imageUrl)
    ? `<img class="tt-img" src="${esc(r.imageUrl)}" alt="${esc(r.commercialName || '')}" onerror="this.remove()">`
    : '';

  const fields = [
    ['Menu', r.menu],
    ['Order Source', locationDisplayName(r.locationSource)],
    ['Service Care', r.serviceCareTitle],
    ['Stock Destination', r.subStockDestination],
    ['Campaign', r.campaignName],
    ['Reserve Location', r.resLocationName],
    ['Reserve Type', r.resType],
    ['Shipping', [r.resShippingType, r.resShippingSLA].filter(x => !isBlank(x)).join(' - ')]
  ];
  const detailHtml = fields.map(([l,v]) => `<div><div class="dl">${esc(l)}</div><div class="dv">${isBlank(v) ? '-' : esc(v)}</div></div>`).join('');

  return `<button type="button" class="tt-close" title="ปิด">&times;</button>
    ${imgHtml}
    <div class="tt-title">${esc(r.commercialName || r.transactionId || '-')}</div>
    ${piiHtml}
    <div class="track-detail-grid">${detailHtml}</div>`;
}

function positionHoverTip(box, anchorRect){
  const pad = 6;
  const w = box.offsetWidth || 160, h = box.offsetHeight || 24;
  let x = anchorRect.left + (anchorRect.width - w) / 2;
  let y = anchorRect.top - h - pad;
  if (y < 8) y = anchorRect.bottom + pad;
  if (x < 8) x = 8;
  if (x + w > window.innerWidth - 8) x = window.innerWidth - w - 8;
  box.style.left = Math.round(Math.max(8, x)) + 'px';
  box.style.top = Math.round(y) + 'px';
}

function initHoverTips(){
  const box = document.getElementById('hoverTip');
  if (!box) return;
  let activeEl = null;
  const show = (el) => {
    const text = el.getAttribute('data-tip');
    if (!text) return;
    activeEl = el;
    box.textContent = text;
    box.classList.add('show');
    positionHoverTip(box, el.getBoundingClientRect());
  };
  const hide = () => { activeEl = null; box.classList.remove('show'); };
  document.addEventListener('mouseover', (e) => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el && el !== activeEl) show(el);
  });
  document.addEventListener('mouseout', (e) => {
    if (!activeEl) return;
    const stillInside = e.relatedTarget && activeEl.contains(e.relatedTarget);
    if (!stillInside) hide();
  });
  document.addEventListener('focusin', (e) => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el) show(el);
  });
  document.addEventListener('focusout', (e) => {
    const el = e.target.closest && e.target.closest('[data-tip]');
    if (el) hide();
  });
  window.addEventListener('scroll', hide, true);
  window.addEventListener('resize', hide);
}

function closeTrackTooltip(){
  openTrackKey = null;
  const box = document.getElementById('trackTooltip');
  if (box){ box.classList.remove('show'); box.innerHTML = ''; }
  document.querySelectorAll('.info-btn.open').forEach(b => b.classList.remove('open'));
}

function positionTrackTooltip(box, anchorRect){
  const pad = 8;
  const w = box.offsetWidth || 280, h = box.offsetHeight || 160;
  let x = anchorRect.right + pad;
  let y = anchorRect.top;
  if (x + w > window.innerWidth - 8) x = anchorRect.left - w - pad;
  if (x < 8) x = Math.min(Math.max(8, anchorRect.left), Math.max(8, window.innerWidth - w - 8));
  if (y + h > window.innerHeight - 8) y = Math.max(8, window.innerHeight - h - 8);
  box.style.left = Math.round(Math.max(8, x)) + 'px';
  box.style.top = Math.round(Math.max(8, y)) + 'px';
}

async function openTrackTooltip(key, btnEl){
  if (openTrackKey === key){ closeTrackTooltip(); return; }
  const row = (lastMetrics && lastMetrics.trackAll || []).find(r => trackRowKey(r) === key);
  const box = document.getElementById('trackTooltip');
  if (!row || !box) return;
  document.querySelectorAll('.info-btn.open').forEach(b => b.classList.remove('open'));
  if (btnEl) btnEl.classList.add('open');
  openTrackKey = key;
  box.innerHTML = '<div class="tt-lock">กำลังโหลด...</div>';
  box.classList.add('show');
  if (btnEl) positionTrackTooltip(box, btnEl.getBoundingClientRect());
  const html = await buildTrackTooltipHtml(row);
  if (openTrackKey !== key) return;
  box.innerHTML = html;
  if (btnEl) positionTrackTooltip(box, btnEl.getBoundingClientRect());
  // Reposition once the product image settles (loaded or failed) — its async height change
  // used to push the bottom fields off-screen on the very first open.
  const img = box.querySelector('.tt-img');
  if (img && btnEl){
    if (img.complete){
      positionTrackTooltip(box, btnEl.getBoundingClientRect());
    } else {
      const reposition = () => { if (openTrackKey === key) positionTrackTooltip(box, btnEl.getBoundingClientRect()); };
      img.addEventListener('load', reposition, {once:true});
      img.addEventListener('error', reposition, {once:true});
    }
  }
}

async function renderTrackingOrders(){
  if (!lastMetrics) return;
  const slider = document.getElementById('sliderTrack');
  const filterInput = document.getElementById('trackFilter');
  if (!slider) return;
  const sliderMax = Math.max(25, lastMetrics.trackTotal);
  if (parseInt(slider.max, 10) !== sliderMax) slider.max = String(sliderMax);
  const n = parseInt(slider.value, 10);
  document.getElementById('sliderTrackVal').textContent = n;
  document.getElementById('tag-tracktotal').textContent = `${fmtNum(lastMetrics.trackGrandTotal)} orders`;

  const q = ((filterInput && filterInput.value) || '').trim().toLowerCase();
  let list = lastMetrics.trackAll;
  if (q){
    list = list.filter(r =>
      (r.transactionId||'').toLowerCase().includes(q) ||
      (r.userId||'').toLowerCase().includes(q) ||
      (r.custFirstName||'').toLowerCase().includes(q) ||
      (r.custLastName||'').toLowerCase().includes(q) ||
      (r.orderType||'').toLowerCase().includes(q) ||
      (r.commercialName||'').toLowerCase().includes(q)
    );
  }
  list = list.slice(0, n);

  if (openTrackKey && !list.some(r => trackRowKey(r) === openTrackKey)) closeTrackTooltip();

  const myToken = ++trackRenderToken;
  const secretKey = getSecretKey();
  const maskedByKey = {};
  if (secretKey){
    await Promise.all(list.map(async r => {
      const [first, last] = await Promise.all([
        decryptCached(r.custFirstName, secretKey),
        decryptCached(r.custLastName, secretKey)
      ]);
      maskedByKey[trackRowKey(r)] = (first === '__DECRYPT_FAILED__' || last === '__DECRYPT_FAILED__')
        ? '⚠️ ถอดรหัสไม่สำเร็จ'
        : customerNameMasked(first, last);
    }));
  }
  if (myToken !== trackRenderToken) return;

  const rowsHtml = list.map((r,i) => {
    const key = trackRowKey(r);
    const isOpen = openTrackKey === key;
    const tsLabel = r.ts ? r.ts.toLocaleString('th-TH') : '-';
    const custName = secretKey ? (maskedByKey[key] || '-') : '🔒';
    const custAttr = secretKey ? '' : ' class="cust-name-cell" data-tip="กรอก Secret Key ในแผงตั้งค่าเพื่อถอดรหัสชื่อ"';
    return `<tr>
      <td class="col-info"><button type="button" class="info-btn${isOpen ? ' open' : ''}" data-track-toggle="${esc(key)}" title="ดูรายละเอียดเพิ่มเติม">i</button></td>
      <td class="col-no">${i+1}</td>
      <td>${esc(tsLabel)}</td>
      <td class="mono">${esc(r.transactionId || '-')}</td>
      <td>${isBlank(r.preBookingNo) ? '<span class="empty" style="padding:0;">-</span>' : esc(r.preBookingNo)}</td>
      <td class="mono">${esc(r.userId || '-')}</td>
      <td${custAttr}>${esc(custName)}</td>
      <td>${esc(r.orderType || '-')}</td>
      <td>${statusBadgeHtml(r.state)}</td>
      <td>${orderStateBadgeHtml(r.orderState)}</td>
      <td>${durationBadgeHtml(r.durationMs, r.createdMs)}</td>
      <td class="col-commname">${commercialNameCellHtml(r)}</td>
      <td class="col-orderomni">${orderOmniCellHtml(r)}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="13" class="empty">ไม่พบข้อมูล</td></tr>`;

  document.getElementById('body-track').innerHTML = rowsHtml;
}

/* ===================== MAIN UPDATE ===================== */
function chartFallback(canvasEl, msg){
  if (!canvasEl) return;
  const div = document.createElement('div');
  div.className = 'empty';
  div.style.paddingTop = '40px';
  div.textContent = msg;
  canvasEl.replaceWith(div);
}
function checkChartLib(){
  if (typeof Chart === 'undefined'){
    ['chartTrend','chartStatus','chartMenu','chartDevice','chartGroup','chartStock','chartBranch','chartCamp','chartDur']
      .forEach(id => chartFallback(document.getElementById(id), 'โหลดไลบรารีกราฟ (Chart.js) ไม่สำเร็จ'));
    return false;
  }
  Chart.defaults.font.family = "'IBM Plex Sans Thai','IBM Plex Sans',sans-serif";
  Chart.defaults.color = '#94A3B8';
  return true;
}

function updateDashboard(rows){
  const M = computeMetrics(rows);
  if (!dashboardBuilt) buildSkeleton();

  lastMetrics = M;

  updateKpis(M);
  updateStatusLegend(M);
  updateTierTiles(M);
  updateLists(M);

  if (checkChartLib()){
    updateTrendChart(M);
    updateStatusChart(M);
    updateMenuChart(M);
    updateDeviceChart(M);
    updateGroupChart(M);
    updateStockChart(M);
    updateBranchChart(M);
    updateCampChart(M);
    updateDurChart(M);
  }

  renderTrackingOrders();

  document.getElementById('dashboard').style.display = 'flex';
  document.getElementById('placeholder').style.display = 'none';

  const rangeEl = document.getElementById('rangeLabel');
  if (rows.length){
    const tsAll = rows.map(r=>r.ts).filter(Boolean);
    if (tsAll.length){
      const min = new Date(Math.min(...tsAll)), max = new Date(Math.max(...tsAll));
      rangeEl.textContent = `ข้อมูลตั้งแต่ ${min.toLocaleString('th-TH')} ถึง ${max.toLocaleString('th-TH')} • ${fmtNum(rows.length)} rows`;
    }
  }
}

/* ===================== ERROR / STATUS UI ===================== */
function setStatus(mode, text){
  const dot = document.getElementById('statusDot');
  dot.className = 'status-dot' + (mode === 'error' ? ' err' : mode === 'loading' ? ' loading' : ' ok');
  document.getElementById('statusText').textContent = text;
}
function showBanner(msg){
  const b = document.getElementById('banner');
  b.innerHTML = msg;
  b.classList.add('show');
}
function hideBanner(){ document.getElementById('banner').classList.remove('show'); }

/* ===================== AUTO REFRESH ===================== */
function resetRefreshBar(){
  const bar = document.getElementById('refreshBar');
  if (!bar) return;
  bar.style.transition = 'none';
  bar.style.width = '0%';
  void bar.offsetWidth;
  bar.style.transition = `width ${AUTO_REFRESH_MS}ms linear`;
  bar.style.width = '100%';
}
function startAutoRefresh(){
  if (refreshTimer) clearInterval(refreshTimer);
  resetRefreshBar();
  refreshTimer = setInterval(() => { resetRefreshBar(); loadData(true); }, AUTO_REFRESH_MS);
}

/* ===================== MAIN LOAD FLOW ===================== */
async function loadData(isAuto){
  const cfg = getConfig();
  if (!cfg.sheetId){
    document.getElementById('configPanel').classList.add('open');
    setStatus('error', 'ยังไม่ได้ตั้งค่า Sheet ID');
    return;
  }
  if (isLoading) return;
  isLoading = true;
  if (!isAuto) setStatus('loading', 'กำลังโหลดข้อมูล...');
  try {
    await loadLocationMasterIfNeeded(cfg.sheetId, !isAuto);
    const {cols, rows} = await fetchSheet(cfg.sheetId, cfg.sheetName);
    const parsed = buildRows(cols, rows);
    updateDashboard(parsed);
    hideBanner();
    setStatus('ok', 'อัปเดตล่าสุด ' + new Date().toLocaleTimeString('th-TH'));
  } catch(err){
    console.error(err);
    setStatus('error', 'โหลดข้อมูลไม่สำเร็จ');
    if (!isAuto || !dashboardBuilt) showBanner('<strong>โหลดข้อมูลไม่สำเร็จ:</strong> ' + err.message);
  } finally {
    isLoading = false;
  }
}

/* ===================== INIT / EVENTS ===================== */
(function init(){
  const cfg = getConfig();
  document.getElementById('inputSheetId').value = cfg.sheetId;
  document.getElementById('inputSheetName').value = cfg.sheetName;
  document.getElementById('inputSecretKey').value = cfg.secretKey;

  const applySecretKey = () => {
    const secretKey = document.getElementById('inputSecretKey').value.trim();
    const saved = JSON.parse(localStorage.getItem(LS_KEY) || '{}');
    saveConfig({ ...saved, secretKey });
    clearDecryptCache();
    closeTrackTooltip();
    renderTrackingOrders();
  };
  document.getElementById('btnApplyKey').addEventListener('click', applySecretKey);
  document.getElementById('inputSecretKey').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') applySecretKey();
  });

  document.getElementById('dashTitle').addEventListener('dblclick', () => {
    document.getElementById('configPanel').classList.toggle('open');
  });
  document.getElementById('btnConfig').addEventListener('click', () => {
    document.getElementById('configPanel').classList.toggle('open');
  });
  document.getElementById('btnRefresh').addEventListener('click', () => { resetRefreshBar(); loadData(false); });

  // Sliders / filter live inside the skeleton which is built after the first load,
  // so bind them as soon as they appear (and only once each).
  const bindControls = () => {
    const sliderTrack = document.getElementById('sliderTrack');
    const trackFilter = document.getElementById('trackFilter');
    if (sliderTrack && !sliderTrack.dataset.bound) {
      sliderTrack.addEventListener('input', renderTrackingOrders);
      sliderTrack.dataset.bound = '1';
    }
    if (trackFilter && !trackFilter.dataset.bound) {
      trackFilter.addEventListener('input', renderTrackingOrders);
      trackFilter.dataset.bound = '1';
    }
    return sliderTrack?.dataset.bound && trackFilter?.dataset.bound;
  };
  const controlBinderTimer = setInterval(() => {
    if (bindControls()) clearInterval(controlBinderTimer);
  }, 50);

  // "i" buttons in the Tracking Order table are recreated on every render, so this is
  // delegated on document instead of bound per-button.
  document.addEventListener('click', (e) => {
    const closeBtn = e.target.closest && e.target.closest('.tt-close');
    if (closeBtn){ closeTrackTooltip(); return; }
    const btn = e.target.closest && e.target.closest('[data-track-toggle]');
    if (btn){ openTrackTooltip(btn.getAttribute('data-track-toggle'), btn); return; }
    if (openTrackKey && !(e.target.closest && e.target.closest('#trackTooltip'))) closeTrackTooltip();
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeTrackTooltip(); });
  window.addEventListener('scroll', () => { if (openTrackKey) closeTrackTooltip(); }, true);
  window.addEventListener('resize', () => { if (openTrackKey) closeTrackTooltip(); });

  initHoverTips();

  document.getElementById('btnLoad').addEventListener('click', () => {
    const sheetId = document.getElementById('inputSheetId').value.trim();
    const sheetName = document.getElementById('inputSheetName').value.trim() || 'Order';
    const secretKey = document.getElementById('inputSecretKey').value.trim();
    if (!sheetId) { showBanner('กรุณากรอก Google Sheet ID'); return; }
    saveConfig({sheetId, sheetName, secretKey});
    document.getElementById('configPanel').classList.remove('open');
    loadData(false);
    startAutoRefresh();
  });

  if (cfg.sheetId) { loadData(false); startAutoRefresh(); }
  else document.getElementById('configPanel').classList.add('open');
})();
</script>
</body>
</html>
